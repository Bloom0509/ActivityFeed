version: '3.8'

services:

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    container_name: backend

    environment:
      MONGO_URI: mongodb://mongo:27017/activityfeed

    ports:
      - "5000:3000"

    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: frontend

    ports:
      - "8888:80"

    depends_on:
      - backend